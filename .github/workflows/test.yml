name: AMP Conformance Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Test Node.js implementation
      run: |
        node reference/daemon.js &
        sleep 2
        node conformance/run.js
        pkill -f "node reference/daemon.js" || true
        sleep 1

    - name: Test Go implementation
      run: |
        go build -o reference/daemon_bin reference/daemon.go
        ./reference/daemon_bin &
        sleep 3
        node conformance/run.js
        pkill -f "reference/daemon_bin" || true