name: AMP Conformance Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Test Node.js implementation
      run: |
        node reference/daemon.js &
        DAEMON_PID=$!
        sleep 2
        node conformance/run.js
        kill $DAEMON_PID

    - name: Test Go implementation
      run: |
        go run reference/daemon.go &
        DAEMON_PID=$!
        sleep 3
        node conformance/run.js
        kill $DAEMON_PID